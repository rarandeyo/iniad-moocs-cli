name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            # keyring crate (sync-secret-service feature) が D-Bus を要求する
            # ので libdbus-1-dev + pkg-config を入れる。GitHub Actions runner
            # には pkg-config はある可能性があるが念のため明示。
            - name: Install libdbus (for keyring crate)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libdbus-1-dev pkg-config

            - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

            - name: Install rustfmt/clippy components
              run: rustup component add rustfmt clippy

            - name: cargo fmt --check
              run: cargo fmt --all -- --check

            - name: cargo clippy
              run: cargo clippy --workspace --tests -- -D warnings

            - name: cargo test
              run: cargo test --workspace
