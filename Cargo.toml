[workspace]
resolver = "2"
members = [
    "crates/imoocs-types",
    "crates/imoocs-browser",
    "crates/imoocs-core",
    "crates/imoocs-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/rarandeyo/iniad-moocs-cli"
authors = ["rarandeyo"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
reqwest = { version = "0.13", features = ["cookies", "gzip", "json", "multipart", "stream", "form", "query"] }
reqwest_cookie_store = { version = "0.10", features = ["serde"] }
cookie_store = "0.22"
scraper = "0.23"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
schemars = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
dialoguer = "0.11"
indicatif = "0.18"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
lopdf = "0.38"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
etcetera = "0.11"
rustix = { version = "1", features = ["fs"] }
sha1 = "0.10"
hex = "0.4"
url = "2"
bytes = "1"
async-trait = "0.1"
once_cell = "1"
futures = "0.3"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
toml = "1"

# Dev
insta = { version = "1", features = ["json"] }
mockito = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
