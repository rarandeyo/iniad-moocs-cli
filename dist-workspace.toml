[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Checksums to generate for each App
checksum = "sha256"
# A namespace to use when publishing this package to the npm registry
npm-scope = "@rarandeyo"
# The npm package should have this name
npm-package = "iniad-moocs-cli"
# Publish jobs to run in CI
publish-jobs = ["npm"]

# aarch64-linux を GitHub 公式 ARM runner で native build (cross 回避)
[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-24.04-arm"
host = "aarch64-unknown-linux-gnu"

# glibc 互換性ガード (Ubuntu 22.04 / Debian 12 相当)
[dist.min-glibc-version]
x86_64-unknown-linux-gnu = "2.35"
aarch64-unknown-linux-gnu = "2.35"

# keyring (sync-secret-service) と reqwest (native-tls) が要求する native deps
[dist.dependencies.apt]
libssl-dev = "*"
libdbus-1-dev = "*"
pkg-config = "*"
